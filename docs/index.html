<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Has the house been stolen?</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f0;
    --fg: #1c1c1c;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: #e3e0d8;
    --yes: #b3261e;
    --no: #1e7a3d;
    --link: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #f0eee7;
      --muted: #a3a3a3;
      --card: #202225;
      --border: #33363a;
      --yes: #ff6b60;
      --no: #4ade80;
      --link: #7fb2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem 1rem;
    text-align: center;
  }
  h1.question {
    font-size: clamp(1.3rem, 3.5vw, 1.9rem);
    font-weight: 600;
    margin: 0 0 1.25rem;
    max-width: 30ch;
  }
  .answer {
    font-size: clamp(4rem, 20vw, 9rem);
    font-weight: 800;
    line-height: 1;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .answer.no { color: var(--no); }
  .answer.yes { color: var(--yes); }
  .answer.unknown { color: var(--muted); font-size: clamp(2rem, 8vw, 3.5rem); }
  .subtext {
    margin-top: 1rem;
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 40ch;
  }
  .card {
    margin-top: 2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    max-width: 42ch;
    text-align: left;
    font-size: 0.9rem;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 0.75rem;
  }
  .record {
    padding: 0.5rem 0;
    border-top: 1px solid var(--border);
  }
  .record:first-child { border-top: none; }
  .record .doctype { font-weight: 600; }
  .record .date { color: var(--muted); }
  .links {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: center;
  }
  a {
    color: var(--link);
  }
  .timestamp {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .error-banner {
    margin-top: 1.5rem;
    max-width: 42ch;
    font-size: 0.85rem;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
  }
</style>
</head>
<body>
  <h1 class="question">Has Bob's house been stolen?</h1>
  <p class="answer unknown" id="answer">…</p>
  <p class="subtext" id="subtext">Checking DuPage County's recorder of deeds…</p>

  <div class="card" id="records-card" hidden>
    <h2>New filings found</h2>
    <div id="records-list"></div>
  </div>

  <div class="links">
    <a href="https://recorder.dupageco.org/Search.aspx" target="_blank" rel="noopener">Check DuPage County's records yourself &rarr;</a>
    <a href="https://www.propertyfraudalert.com/ILDupage" target="_blank" rel="noopener">Sign up for the county's free real-time fraud alerts &rarr;</a>
  </div>

  <p class="timestamp" id="timestamp"></p>
  <p class="error-banner" id="error-banner" hidden></p>

<script>
async function main() {
  const answerEl = document.getElementById("answer");
  const subtextEl = document.getElementById("subtext");
  const timestampEl = document.getElementById("timestamp");
  const errorBannerEl = document.getElementById("error-banner");
  const recordsCard = document.getElementById("records-card");
  const recordsList = document.getElementById("records-list");

  try {
    const res = await fetch("data.json", { cache: "no-store" });
    const data = await res.json();

    if (data.status === "Yes") {
      answerEl.textContent = "Yes";
      answerEl.className = "answer yes";
      subtextEl.textContent = "Something new was filed against the property. This doesn't necessarily mean fraud — click through and take a look.";
    } else {
      answerEl.textContent = "No";
      answerEl.className = "answer no";
      subtextEl.textContent = "Nothing new on file. Still probably worth a look yourself now and then.";
    }

    if (data.new_records && data.new_records.length > 0) {
      recordsCard.hidden = false;
      recordsList.innerHTML = data.new_records.map(r => `
        <div class="record">
          <div class="doctype">${escapeHtml(r.doc_type)}</div>
          <div class="date">${escapeHtml(r.date_recorded)} &middot; ${escapeHtml(r.doc_number)}</div>
        </div>
      `).join("");
    }

    if (data.checked_at) {
      const d = new Date(data.checked_at);
      timestampEl.textContent = "Last checked " + d.toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short",
      });
    }

    if (data.last_check_error) {
      errorBannerEl.hidden = false;
      errorBannerEl.textContent = "Note: the most recent automated check didn't complete successfully, so this reflects the last known good result. (" + data.last_check_error + ")";
    }
  } catch (e) {
    answerEl.textContent = "?";
    answerEl.className = "answer unknown";
    subtextEl.textContent = "Couldn't load the latest check. Try the link below instead.";
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

main();
</script>
</body>
</html>
