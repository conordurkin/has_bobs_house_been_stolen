name: Check DuPage recorder records

on:
  schedule:
    # 13:00 UTC = 8:00am America/Chicago (7:00am during standard time)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run check
        env:
          OWNER_LAST_NAME: ${{ secrets.OWNER_LAST_NAME }}
          OWNER_FIRST_NAME_1: ${{ secrets.OWNER_FIRST_NAME_1 }}
          OWNER_FIRST_NAME_2: ${{ secrets.OWNER_FIRST_NAME_2 }}
          PROPERTY_HOUSE_NUMBER: ${{ secrets.PROPERTY_HOUSE_NUMBER }}
          PROPERTY_STREET: ${{ secrets.PROPERTY_STREET }}
          PROPERTY_CITY: ${{ secrets.PROPERTY_CITY }}
        run: python scraper/check_records.py

      - name: Commit updated data.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update records check result"
          git push
